name: Run GVEM

on:
  workflow_dispatch

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  RAYON_NUM_THREADS: "1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      #- name: Install OpenBLAS
        #run: |
          #sudo apt-get update
          #sudo apt-get install -y pkg-config libopenblas-dev

      - name: Build
        run: cargo build --release
        env:
          RUSTFLAGS: "-C target-cpu=native"
          #RUSTFLAGS: "-C link-arg=-L/usr/lib/x86_64-linux-gnu/openblas-pthread -C link-arg=-lopenblas"

      - name: Run GVEM application
        #run: RUST_BACKTRACE=full cargo run --release -- 600 2 --family wild --json out/wild.json -v > out/wild.txt 2>&1
        run: RUST_BACKTRACE=full cargo run --release -- train > out/output.txt 2>&1
        env:
          RUSTFLAGS: "-C target-cpu=native"
          #RUSTFLAGS: "-C link-arg=-L/usr/lib/x86_64-linux-gnu/openblas-pthread -C link-arg=-lopenblas"

      - name: Run test
        #if: always()
        run: cargo test -- --nocapture

      - name: Debug - Show files and Git status
        if: always()
        run: |
          echo "=== Files in directories ==="
          #ls -la results/ checkpoints/ || echo "Directories not found!"
          ls -la out/ || echo "Directories not found!"
          echo "=== Git Status (including ignored) ==="
          git status --ignored

      - name: Commit and Push changes
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Resultats simulation: ${{ github.run_number }}"
          #file_pattern: 'results/ checkpoints/'
          file_pattern: 'out/ runs/'
          add_options: '-f'